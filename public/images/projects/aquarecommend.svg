<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#F8FAFC"/>
  <!-- Top Nav -->
  <rect x="40" y="30" width="720" height="40" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <circle cx="65" cy="50" r="5" fill="#EF4444"/>
  <circle cx="82" cy="50" r="5" fill="#F59E0B"/>
  <circle cx="99" cy="50" r="5" fill="#10B981"/>
  <text x="130" y="55" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0F172A">AquaRecommend AI • Water Quality & Fish Diagnostics</text>
  <rect x="635" y="40" width="110" height="20" rx="10" fill="#FEF3C7" stroke="#FDE68A"/>
  <text x="655" y="54" font-family="sans-serif" font-size="10" font-weight="600" fill="#D97706">Model Training</text>

  <!-- Water Quality Parameters -->
  <rect x="40" y="85" width="220" height="95" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="60" y="112" font-family="sans-serif" font-size="11" fill="#64748B">Dissolved Oxygen (DO)</text>
  <text x="60" y="145" font-family="sans-serif" font-size="22" font-weight="bold" fill="#0F172A">6.8 mg/L</text>
  <rect x="60" y="157" width="120" height="6" rx="3" fill="#E2E8F0"/>
  <rect x="60" y="157" width="95" height="6" rx="3" fill="#10B981"/>

  <rect x="290" y="85" width="220" height="95" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="310" y="112" font-family="sans-serif" font-size="11" fill="#64748B">Acidity (pH Level)</text>
  <text x="310" y="145" font-family="sans-serif" font-size="22" font-weight="bold" fill="#0F172A">7.4 pH</text>
  <rect x="310" y="157" width="120" height="6" rx="3" fill="#E2E8F0"/>
  <rect x="310" y="157" width="85" height="6" rx="3" fill="#2563EB"/>

  <rect x="540" y="85" width="220" height="95" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
