  <text x="612" y="302" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2563EB">94%</text>
  <text x="540" y="370" font-family="sans-serif" font-size="11" fill="#64748B">Cross-validated across 1,500+ aquaculture samples.</text>
