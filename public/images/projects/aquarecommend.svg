  <text x="560" y="145" font-family="sans-serif" font-size="22" font-weight="bold" fill="#0F172A">27.5 °C</text>
  <rect x="560" y="157" width="120" height="6" rx="3" fill="#E2E8F0"/>
  <rect x="560" y="157" width="70" height="6" rx="3" fill="#F59E0B"/>

  <!-- AI Diagnosis & Action Protocol -->
  <rect x="40" y="195" width="440" height="215" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="60" y="225" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0F172A">Machine Learning Diagnostic Inference</text>

  <rect x="60" y="245" width="400" height="45" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="75" y="267" font-family="sans-serif" font-size="11" font-weight="600" fill="#065F46">Water Quality Index: Optimal (Score 92/100)</text>
  <text x="75" y="282" font-family="sans-serif" font-size="10" fill="#047857">Parameters indicate balanced ecosystem with low pathogen risk.</text>

  <rect x="60" y="300" width="400" height="45" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="75" y="322" font-family="sans-serif" font-size="11" font-weight="600" fill="#1E40AF">Aeration Schedule Recommendation</text>
  <text x="75" y="337" font-family="sans-serif" font-size="10" fill="#1D4ED8">Maintain paddlewheel aeration for 4 hours starting at 22:00.</text>

  <rect x="60" y="355" width="400" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="75" y="379" font-family="sans-serif" font-size="11" fill="#475569">Fish Pathology Symptom Analyzer Ready</text>

  <!-- AI Confidence Card -->
  <rect x="500" y="195" width="260" height="215" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="520" y="225" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0F172A">Diagnostic Confidence</text>
